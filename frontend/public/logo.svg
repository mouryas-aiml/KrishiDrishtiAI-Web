<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123c2d" />
      <stop offset="100%" stop-color="#0a231a" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f57a" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
  </defs>
  <!-- Background Shield / Rounded Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#kd-bg)" stroke="#2d6a52" stroke-width="2.5" />
  
  <!-- AI Vision Reticle Aperture Corners -->
  <path d="M 22 42 L 22 26 A 4 4 0 0 1 26 22 L 42 22" stroke="url(#ring-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 98 42 L 98 26 A 4 4 0 0 0 94 22 L 78 22" stroke="url(#ring-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 22 78 L 22 94 A 4 4 0 0 0 26 98 L 42 98" stroke="url(#ring-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 98 78 L 98 94 A 4 4 0 0 1 94 98 L 78 98" stroke="url(#ring-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  
  <!-- Central Stylized Crop Leaf -->
  <path d="M 60 25 C 75 34 88 52 82 74 C 77 91 62 96 60 96 C 58 96 43 91 38 74 C 32 52 45 34 60 25 Z" fill="url(#leaf-grad)" />
  
  <!-- Leaf Central Spine / Vision Beam -->
  <path d="M 60 32 L 60 88" stroke="#123c2d" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Diagonal Leaf Veins -->
  <path d="M 60 48 Q 70 44 74 41" stroke="#123c2d" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 60 58 Q 50 54 46 51" stroke="#123c2d" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 60 68 Q 71 65 74 62" stroke="#123c2d" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 60 76 Q 51 73 48 71" stroke="#123c2d" stroke-width="2.2" stroke-linecap="round" />

  <!-- Drishti Eye / AI Neural Sensor Core -->
  <circle cx="60" cy="58" r="5.5" fill="#ffffff" stroke="#123c2d" stroke-width="2" />
  <circle cx="60" cy="58" r="2.2" fill="#123c2d" />
</svg>

