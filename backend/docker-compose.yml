services:
  postgres:
    image: postgres:16
    container_name: krishi-drishti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: krishi_drishti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - krishi-drishti-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d krishi_drishti"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  krishi-drishti-postgres-data:
